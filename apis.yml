aid: uptime
name: Uptime
description: 'Uptime (Uptime SAS, Paris, SIREN 822006839) was a French elevator predictive-maintenance
  company founded in 2016 by Augustin and Amaury Celier. It fitted 4G-connected sensors to existing
  elevators and used the resulting telemetry to predict failures, dispatch technicians and report
  availability to building managers, backed by Serena and angels including Jacques-Antoine Granjon,
  David Amsellem, Yvan Wibaux and Antoine Martin across roughly EUR 10M of funding. The Paris
  Commercial Court opened a redressement judiciaire on 2022-07-26 and pronounced liquidation
  judiciaire with a plan de cession to SAS Otis on 2022-10-20; the elevator-maintenance activity and
  a minority of staff transferred to Otis. The company never published a public developer program,
  API reference or machine-readable specification, and the uptime.ac domain has since lapsed — it
  now 301-redirects every path to unrelated third-party sites. This profile is retained as an
  honest record of a defunct company with no API surface.'
